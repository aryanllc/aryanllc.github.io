<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Snake Game</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0d10;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 18px;
      letter-spacing: -1px;
    }

    .score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 0 4px;

      color: #b9c0ca;
    }

    .score {
      color: #ffffff;
      font-weight: 700;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #15181d;
      border: 2px solid #292e36;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      touch-action: none;
    }

    .controls {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      background: #38d66f;
      color: #06110a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    .instructions {
      margin-top: 14px;

      margin-top: 12px;

      color: #ff6975;
      font-weight: 700;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 34px;
      }

      body {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="game-container">

    <h1>Snake</h1>

    <div class="score-bar">
      <span>Score: <span id="score" class="score">0</span></span>
      <span>Best: <span id="highScore" class="score">0</span></span>
    </div>

    <canvas id="game" width="500" height="500"></canvas>

    <div class="controls">
      <button id="restart">Restart</button>
    </div>

    <p class="instructions">
      Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move.
      <br>
      Eat the red food and don't hit the wall or yourself.
    </p>

    <div id="gameOver" class="game-over"></div>

  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const highScoreElement = document.getElementById("highScore");
    const gameOverElement = document.getElementById("gameOver");
    const restartButton = document.getElementById("restart");

    const GRID_SIZE = 25;
    const CELL_SIZE = canvas.width / GRID_SIZE;
    const GAME_SPEED = 100;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let gameOver;
    let gameLoop;

    let highScore =
      Number(localStorage.getItem("snakeHighScore")) || 0;

    highScoreElement.textContent = highScore;

    function startGame() {
      snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 }
      ];

      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };

      score = 0;
      gameOver = false;

      scoreElement.textContent = score;
      gameOverElement.textContent = "";

      createFood();

      clearInterval(gameLoop);
      gameLoop = setInterval(updateGame, GAME_SPEED);

      draw();
    }

    function createFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID_SIZE),
          y: Math.floor(Math.random() * GRID_SIZE)
        };
      } while (
        snake.some(
          part => part.x === food.x && part.y === food.y
        )
      );
    }

    function updateGame() {
      if (gameOver) return;

      direction = nextDirection;

      const newHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      // Wall collision
      if (
        newHead.x < 0 ||
        newHead.x >= GRID_SIZE ||
        newHead.y < 0 ||
        newHead.y >= GRID_SIZE
      ) {
        endGame();
        return;
      }

      // Self collision
      if (
        snake.some(
          part =>
            part.x === newHead.x &&
            part.y === newHead.y
        )
      ) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      // Food collision
      if (
        newHead.x === food.x &&
        newHead.y === food.y
      ) {
        score++;

        scoreElement.textContent = score;

        if (score > highScore) {
          highScore = score;

          localStorage.setItem(
            "snakeHighScore",
            highScore
          );

          highScoreElement.textContent = highScore;
        }

        createFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = "#15181d";
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      // Grid
      ctx.strokeStyle = "#1e2229";
      ctx.lineWidth = 1;

      for (let i = 1; i < GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(
          i * CELL_SIZE,
          canvas.height
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(
          canvas.width,
          i * CELL_SIZE
        );
        ctx.stroke();
      }

      // Food
      const foodCenterX =
        food.x * CELL_SIZE + CELL_SIZE / 2;

      const foodCenterY =
        food.y * CELL_SIZE + CELL_SIZE / 2;

      ctx.fillStyle = "#ff4f5e";

      ctx.beginPath();

      ctx.arc(
        foodCenterX,
        foodCenterY,
        CELL_SIZE * 0.32,
        0,
        Math.PI * 2
      );

      ctx.fill();

      // Snake
      snake.forEach((part, index) => {
        const padding = 2;

        ctx.fillStyle =
          index === 0
            ? "#72f39a"
            : "#39d871";

        ctx.beginPath();

        ctx.roundRect(
          part.x * CELL_SIZE + padding,
          part.y * CELL_SIZE + padding,
          CELL_SIZE - padding * 2,
          CELL_SIZE - padding * 2,
          6
        );

        ctx.fill();
      });
    }

    function endGame() {
      gameOver = true;

      clearInterval(gameLoop);

      gameOverElement.textContent =
        "Game Over — press Restart or Enter to play again.";

      draw();
    }

    function setDirection(x, y) {
      // Prevent instantly reversing into yourself
      if (
        direction.x === -x &&
        direction.y === -y
      ) {
        return;
      }

      nextDirection = { x, y };
    }

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();

      if (
        [
          "arrowup",
          "arrowdown",
          "arrowleft",
          "arrowright",
          "w",
          "a",
          "s",
          "d",
          "enter"
        ].includes(key)
      ) {
        event.preventDefault();
      }

      if (key === "arrowup" || key === "w") {
        setDirection(0, -1);
      }

      if (key === "arrowdown" || key === "s") {
        setDirection(0, 1);
      }

      if (key === "arrowleft" || key === "a") {
        setDirection(-1, 0);
      }

      if (key === "arrowright" || key === "d") {
        setDirection(1, 0);
      }

      if (key === "enter" && gameOver) {
        startGame();
      }
    });

    restartButton.addEventListener(
      "click",
      startGame
    );

    // Start the game
    startGame();
  </script>

</body>
</html>
